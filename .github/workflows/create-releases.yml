name: Create Firmware & Editor Releases

on:
  push:
    branches:
      - main
    paths:
      - 'solis-ventus-firmwares/**'
      - 'duophony-firmwares/**'
      - 'enieqma-firmwares/**'
      - 'cabzeus-firmwares/**'
      - 'synesthesia-firmwares/**'
      - 'specular-tempus-firmwares/**'
      - 'editors/**'
      - 'manuals/**'
      - 'artist-series-presets/**'
      - 'versions-reference/**'
      - '*.zip'
      - '*.exe'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          # ── HELPER: slugify a string to a URL-safe release tag ────
          slugify() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -d '()' | tr -s '-'
          }

          # ── HELPER: predict the release-asset name GitHub will store
          # for a given local filename, so it can be compared against the
          # live asset list without a false mismatch. Reverse-engineered
          # from GitHub's actual behavior (validated against every asset
          # currently in this repo): characters outside [A-Za-z0-9._- ]
          # are deleted, then runs of spaces collapse to a single '.'.
          gh_asset_name() {
            printf '%s' "$1" | sed -E 's/[^A-Za-z0-9._ -]//g; s/ +/./g; s/^\.+//; s/\.+$//'
          }

          # ── HELPER: create or upload to existing release ──────────
          upload_to_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            shift 3
            local files=("$@")

            gh release upload "$tag" "${files[@]}" \
              --repo "${{ github.repository }}" \
              --clobber 2>/dev/null || \
            gh release create "$tag" "${files[@]}" \
              --title "$title" \
              --repo "${{ github.repository }}" \
              --notes "$notes" \
              2>&1 || echo "⚠ Skipped $tag"
          }

          # ── HELPER: replace a floating release's contents with exactly
          # these files. Uploads/creates first; only prunes remote assets
          # that are no longer wanted AFTER that succeeds, so a failed
          # upload/create (e.g. a transient GitHub API error) leaves the
          # previous release state intact instead of deleting it outright.
          replace_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            shift 3
            local files=("$@")

            if ! gh release upload "$tag" "${files[@]}" --repo "${{ github.repository }}" --clobber 2>/dev/null; then
              if ! gh release create "$tag" "${files[@]}" \
                  --title "$title" --repo "${{ github.repository }}" --notes "$notes" 2>&1; then
                echo "  ⚠ Skipped $tag (upload/create failed — previous release left untouched)"
                return 1
              fi
            fi

            # Predicted GitHub-sanitized name for each local file — used
            # for BOTH the completeness check and the prune check below,
            # so they're always compared against the live list in the
            # same name-space (see gh_asset_name comment: comparing raw
            # local basenames directly against already-sanitized live
            # names was the bug that made this helper delete every wanted
            # asset whose filename had a space in it, every run).
            local wantnames=()
            local f
            for f in "${files[@]}"; do wantnames+=("$(gh_asset_name "$(basename "$f")")"); done

            local livenames=()
            mapfile -t livenames < <(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null)

            # Verify every wanted file actually landed — gh has, in
            # practice, returned success while silently dropping some
            # assets from a multi-file upload. Retry any that are missing,
            # once.
            local missing_files=()
            local i name found w
            for i in "${!files[@]}"; do
              name="${wantnames[$i]}"
              found=0
              for w in "${livenames[@]}"; do
                [ "$name" = "$w" ] && found=1 && break
              done
              [ "$found" -eq 0 ] && missing_files+=("${files[$i]}")
            done

            if [ ${#missing_files[@]} -gt 0 ]; then
              echo "  ⚠ $tag missing ${#missing_files[@]} asset(s) after upload, retrying: ${missing_files[*]}"
              gh release upload "$tag" "${missing_files[@]}" --repo "${{ github.repository }}" --clobber 2>/dev/null || \
                echo "  ⚠ $tag retry failed — may still be missing: ${missing_files[*]}"
              mapfile -t livenames < <(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null)
            fi

            # Prune remote assets that are no longer wanted.
            local keep
            for name in "${livenames[@]}"; do
              keep=0
              for w in "${wantnames[@]}"; do
                [ "$name" = "$w" ] && keep=1 && break
              done
              if [ "$keep" -eq 0 ]; then
                echo "  → pruning stale asset from $tag: $name"
                gh release delete-asset "$tag" "$name" --repo "${{ github.repository }}" --yes 2>/dev/null || true
              fi
            done
          }

          # ── ROOT LEVEL DRIVERS ────────────────────────────────────
          echo "── Root drivers ──"
          mapfile -d '' rootfiles < <(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" \) -print0)
          if [ ${#rootfiles[@]} -gt 0 ]; then
            upload_to_release "drivers-and-tools" "Drivers & Tools" "USB drivers and general tools" "${rootfiles[@]}"
          fi

          # ── FIRMWARES ─────────────────────────────────────────────
          echo "── Firmwares ──"
          declare -A FIRMWARE_MAP=(
            ["solis-ventus-firmwares"]="solis-ventus"
            ["duophony-firmwares"]="duophony"
            ["enieqma-firmwares"]="enieqma"
            ["cabzeus-firmwares"]="cabzeus"
            ["synesthesia-firmwares"]="synesthesia"
            ["specular-tempus-firmwares"]="specular-tempus"
          )

          for folder in "${!FIRMWARE_MAP[@]}"; do
            product="${FIRMWARE_MAP[$folder]}"
            echo "  ── $product ──"

            # Versioned .fdt files at top level only
            while IFS= read -r -d '' file; do
              filename=$(basename "$file")
              slug=$(slugify "${filename%.fdt}")
              tag="${product}-${slug}"

              echo "  → $tag"
              upload_to_release "$tag" "$filename" "Firmware release for $product" "$file"

            done < <(find "$folder" -maxdepth 1 -name "*.fdt" -print0)

            # newest/ — stable floating tag, replaced in place each run
            # includes all manuals for this product if they exist
            while IFS= read -r -d '' file; do
              tag="${product}-newest"
              echo "  → $tag (floating)"

              # Collect manuals for this product
              mapfile -d '' manuals < <(find "manuals/${product}" -maxdepth 1 -type f -name "*.pdf" -print0 2>/dev/null)

              # Collect firmware update history PDF for this product
              mapfile -d '' history < <(find "${folder}/firmware-update-history" -maxdepth 1 -type f -name "*.pdf" -print0 2>/dev/null)

              # Build file list: firmware + manuals + history combined
              allfiles=("$file" "${manuals[@]}" "${history[@]}")

              replace_release "$tag" "${product} - Latest Firmware" "Always points to the latest firmware for $product" "${allfiles[@]}"

            done < <(find "$folder/newest" -maxdepth 1 -name "*.fdt" -print0 2>/dev/null)

          done

          # Synesthesia patch bundle (zips, not fdts — needs its own release)
          echo "  → synesthesia-patch-bundle"
          mapfile -d '' bundlefiles < <(find "synesthesia-firmwares/firmware-software-patch-bundle" -maxdepth 1 -type f ! -name ".DS_Store" -print0 2>/dev/null)
          if [ ${#bundlefiles[@]} -gt 0 ]; then
            upload_to_release "synesthesia-patch-bundle" "Synesthesia Firmware + Software Patch Bundle" "Combined firmware and software patch package for Synesthesia" "${bundlefiles[@]}"
          fi

          # ── EDITORS ───────────────────────────────────────────────
          echo "── Editors ──"
          declare -A EDITOR_MAP=(
            ["editors/cabslab"]="cabslab"
            ["editors/duophony"]="duophony-dfu"
            ["editors/enieqlab"]="enieqlab"
            ["editors/speclab"]="speclab"
            ["editors/sv-studio"]="sv-studio"
            ["editors/symmlab"]="symmlab"
          )

          for folder in "${!EDITOR_MAP[@]}"; do
            product="${EDITOR_MAP[$folder]}"
            echo "  ── $product ──"

            # Version subfolders (exclude patch/ which is a category not a version)
            while IFS= read -r -d '' versiondir; do
              version=$(basename "$versiondir")

              # Skip non-version folders
              case "$version" in
                patch|patches|drivers|extras) continue ;;
              esac

              slug=$(slugify "$version")
              tag="${product}-${slug}"

              mapfile -d '' files < <(find "$versiondir" -maxdepth 1 -type f ! -name ".DS_Store" -print0)
              [ ${#files[@]} -eq 0 ] && echo "  ⚠ Empty: $versiondir" && continue

              echo "  → $tag (${#files[@]} files)"
              upload_to_release "$tag" "$version" "Editor release: $version" "${files[@]}"

            done < <(find "$folder" -mindepth 1 -maxdepth 1 -type d -print0)

            # Loose files directly in editor root (sv-studio 1.0.0, duophony DFU loose files, symmlab READMEs)
            mapfile -d '' loosefiles < <(find "$folder" -maxdepth 1 -type f ! -name ".DS_Store" -print0)
            if [ ${#loosefiles[@]} -gt 0 ]; then
              tag="${product}-extras"
              echo "  → $tag (${#loosefiles[@]} loose files)"
              upload_to_release "$tag" "${product} - Extra Files" "Drivers, READMEs, and miscellaneous files for $product" "${loosefiles[@]}"
            fi

            # patch/ subfolder (symmlab) — treat as its own dated release
            if [ -d "$folder/patch" ]; then
              mapfile -d '' patchfiles < <(find "$folder/patch" -maxdepth 1 -type f ! -name ".DS_Store" -print0)
              if [ ${#patchfiles[@]} -gt 0 ]; then
                tag="${product}-patch"
                echo "  → $tag"
                upload_to_release "$tag" "${product} - Patch" "Patch files for $product" "${patchfiles[@]}"
              fi
            fi

          done

          # ── MANUALS (per-product, standalone) ──────────────────────
          # Every subfolder under manuals/ gets its own release, regardless
          # of whether that product has a firmware/editor entry above.
          # This is what actually publishes things like the cabzeus manual,
          # which previously had no release at all to attach to.
          echo "── Manuals ──"
          while IFS= read -r -d '' manualdir; do
            manualproduct=$(basename "$manualdir")

            mapfile -d '' manualfiles < <(find "$manualdir" -maxdepth 1 -type f -name "*.pdf" -print0)
            [ ${#manualfiles[@]} -eq 0 ] && continue

            tag="${manualproduct}-manuals"
            echo "  → $tag (${#manualfiles[@]} files)"
            upload_to_release "$tag" "${manualproduct} - Manuals" "Manuals and documentation for $manualproduct" "${manualfiles[@]}"

          done < <(find "manuals" -mindepth 1 -maxdepth 1 -type d -print0)

          # ── ARTIST SERIES PRESETS ────────────────────────────────────
          echo "── Artist series presets ──"
          mapfile -d '' presetfiles < <(find "artist-series-presets" -maxdepth 1 -type f ! -name ".DS_Store" -print0 2>/dev/null)
          if [ ${#presetfiles[@]} -gt 0 ]; then
            upload_to_release "artist-series-presets" "Artist Series Presets" "Artist series preset bundles" "${presetfiles[@]}"
          fi

          # ── VERSIONS REFERENCE ───────────────────────────────────────
          echo "── Versions reference ──"
          mapfile -d '' verreffiles < <(find "versions-reference" -maxdepth 1 -type f ! -name ".DS_Store" -print0 2>/dev/null)
          if [ ${#verreffiles[@]} -gt 0 ]; then
            upload_to_release "versions-reference" "Versions Reference" "Version and entitlement reference data" "${verreffiles[@]}"
          fi

          echo "✅ Done"